name: Registrar hora del sistema
on:
  schedule:
    - cron: '0 * * * *'  # cada hora
  workflow_dispatch:  # permite ejecución manual para debug

jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar script
        run: python script.py
      - name: Commit si hay cambios
        run: |
          git config user.name "amonterod"
          git config user.email "amonterod@gmail.com"
          git add hora.json
          git diff --staged --quiet || git commit -m "Actualiza hora"
          git push